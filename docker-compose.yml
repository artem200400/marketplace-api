services:
  postgres:
    image: postgres:17-alpine
    container_name: marketplace-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_password
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: marketplace-pgbouncer

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "6432:6432"

    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

    command:
      - /usr/bin/pgbouncer
      - /etc/pgbouncer/pgbouncer.ini

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 6432 -U marketplace_user -d marketplace"
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  pact-broker-postgres:
    image: postgres:16-alpine
    container_name: marketplace-pact-broker-postgres

    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact_broker

    volumes:
      - pact_broker_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U pact -d pact_broker"
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: marketplace-pact-broker

    depends_on:
      pact-broker-postgres:
        condition: service_healthy

    ports:
      - "9292:9292"

    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@pact-broker-postgres/pact_broker
      PACT_BROKER_PORT: "9292"
      PACT_BROKER_LOG_LEVEL: INFO

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ruby -rnet/http -ruri -e \"r=Net::HTTP.get_response(URI('http://127.0.0.1:9292/diagnostic/status/heartbeat')); exit(r.is_a?(Net::HTTPSuccess) ? 0 : 1)\""
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: marketplace-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: marketplace
      RABBITMQ_DEFAULT_PASS: marketplace_password

    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis-cache:
    image: redis:8.4-alpine
    container_name: marketplace-redis-cache

    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"

    ports:
      - "6381:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  redis-queue:
    image: redis:8.4-alpine
    container_name: marketplace-redis-queue

    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    ports:
      - "6382:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  restore-postgres:
    image: postgres:17-alpine
    profiles:
      - restore-drill

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: restore_admin_password
      POSTGRES_DB: marketplace_restore

    volumes:
      - restore_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  restore_data:
  pact_broker_data: