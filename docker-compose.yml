services:
  postgres:
    image: postgres:17-alpine
    container_name: marketplace-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin_password
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres"
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: marketplace-pgbouncer

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "6432:6432"

    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

    command:
      - /usr/bin/pgbouncer
      - /etc/pgbouncer/pgbouncer.ini

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 6432 -U marketplace_user -d marketplace"
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  restore-postgres:
    image: postgres:17-alpine
    profiles:
      - restore-drill

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: restore_admin_password
      POSTGRES_DB: marketplace_restore

    volumes:
      - restore_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  restore_data: