name: HW31 Lockfile Sync

on:
  push:
    branches:
      - hw-31
    paths:
      - infra/package.json
      - .github/workflows/hw31-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hw-31

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Update lockfile
        working-directory: infra
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- infra/package-lock.json; then
            echo "lockfile unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/package-lock.json
          git commit -m "build(hw31): sync Pulumi AWS lockfile"
          git push origin HEAD:hw-31
