name: Coursework acceptance

on:
  push:
    branches: [coursework]
  pull_request:
    branches: [hw-32]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://marketplace_user:marketplace_password@127.0.0.1:6432/marketplace
      SKIP_VAULT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: docker compose -f docker-compose.yml -f compose.coursework.yml up -d --wait api
      - run: node scripts/coursework-smoke.mjs
      - run: npm run test:e2e
      - if: failure()
        run: docker compose -f docker-compose.yml -f compose.coursework.yml logs --no-color --tail=160 api rabbitmq pgbouncer postgres
      - if: always()
        run: docker compose -f docker-compose.yml -f compose.coursework.yml down -v
